<!DOCTYPE html> <!-- USANDO A VERSÃO MAIS NOVA DO HTML -->

<!-- language - idioma / lingua -->
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.botpress.cloud https://files.bpcontent.cloud https://webchat.botpress.cloud; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://cdn.botpress.cloud https://files.bpcontent.cloud https://webchat.botpress.cloud; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https://cdn.botpress.cloud https://files.bpcontent.cloud https://webchat.botpress.cloud; frame-src 'self' https://cdn.botpress.cloud https://webchat.botpress.cloud; object-src 'none'; base-uri 'self'; form-action 'self'">

    <script src="https://cdn.botpress.cloud/webchat/v3.3/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2025/09/11/19/20250911190621-JM96R9IU.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>StarBucks-IA</title>
</head>

<body>
    <div class="circulo"></div>

    <img src="img/logo.png" alt="Starbucks logo" class="logo">


    <div class="caixa-conteudo">

        <div class="caixa-textos">

            <h2>StarBucks IA</h2>
            <p class="paragrafo">Your day starts here.
            </p>
            <button>Tap the STAR</button>
        </div>

        <div class="caixa-imagem">
            <img src="img/img1.png" alt="Starbucks cup" class="imagem-copo">
        </div>

    </div>


    <div class="caixa-menu">
        <img src="img/thumb1.png" alt="cup option" class="botao-menu" data-cor="#017143" data-numero="1">
        <img src="img/thumb2.png" alt="cup option" class="botao-menu" data-cor="#eb7495" data-numero="2">
        <img src="img/thumb3.png" alt="cup option" class="botao-menu" data-numero="3" data-cor="#d752b1">
    </div>



</body>
<script src="scripts.js"></script>

</html>
